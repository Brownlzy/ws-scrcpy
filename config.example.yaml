# Run configuration example. See full config file spec in src/types/Configuration.d.ts

# Device trackers
## track android devices (default: true, if was INCLUDE_GOOG enabled in build config)
runGoogTracker: false
## track iOS devices (default: true, if was INCLUDE_APPL enabled in build config)
runApplTracker: false;

# HTTP[s] servers configuration
server:
  - secure: false
    port: 8000
    redirectToSecure:
      port: 8443
      host: first-mobile-stand.example.com
  - secure: true
    port: 8443
    options:
      certPath: /Users/example/ssl/STAR_example_com.crt
      keyPath: /Users/example/ssl/STAR_example_com.key

# Announce remote device trackers. The server doesn't check their availability.
remoteHostList:
  - useProxy: true   # optional, default: false
    type: android    # required, "android" | "ios" | ["android", "ios"]
    secure: true     # required, false for HTTP, true for HTTPS
    hostname: second-mobile-stand.example.com
    port: 8443
  - useProxy: true
    type: ios
    secure: true
    hostname: second-mobile-stand.example.com
    port: 8443
  - useProxy: true
    type:           # short variant
      - ios
      - android
    secure: true
    hostname: third-mobile-stand.example.com
    port: 8443

# Optional frp integration for replacing RemoteAssistant.
# frps web admin is used to discover registered remote stcp proxies named "adb_<deviceId>".
# ws-scrcpy starts a temporary frpc process for the selected remote device.
frp:
  enabled: false
  frps:
    baseUrl: http://frps.example.com:7500
    username: admin
    password: admin
    timeoutMs: 5000
  frpc:
    executablePath: ../RemoteAssistant/frpc.exe
    tempConfigDir: ./tmp/frpc
    serverAddr: frps.example.com
    serverPort: 7000
    dnsServer: 223.5.5.5
    authToken: redacted
  adb:
    bindAddr: 127.0.0.1
    portRange:
      start: 20000
      end: 29999
    connectTimeoutMs: 15000
    idleTimeoutMs: 300000
    secretKey: secret
    serverNamePrefix: adb_
    visitorNamePrefix: ws_scrcpy_adb_visitor_
